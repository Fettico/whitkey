  alphabet: "bpmfdtnlgkhjqxzcsrywe"
  initials: "bpmfdtnlgkhjqxzcsrywe"

translator:
  dictionary: whitkey_two_part
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
