# 四音码两分的内部索引设置，文件编码为 UTF-8。
# 主方案依赖它来编译查询资源，不把它加入可切换的方案列表。
schema:
  schema_id: whitkey_two_part
  version: "1"

engine:
  processors: [speller, selector, express_editor]
