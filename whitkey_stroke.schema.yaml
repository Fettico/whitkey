# OB 全笔画的内部索引设置，文件编码为 UTF-8。
# 主方案依赖它来编译查询资源，不把它加入可切换的方案列表。
schema:
  schema_id: whitkey_stroke
  version: "1"

engine:
  processors: [speller, selector, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [table_translator]

speller:
  alphabet: "viuoa"
  initials: "viuoa"

translator:
  dictionary: whitkey_stroke
  prism: whitkey_stroke
  enable_user_dict: false
  enable_sentence: false
  enable_completion: true
